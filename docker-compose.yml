version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: swifttrack-postgres
    environment:
      POSTGRES_DB: swifttrack
      POSTGRES_USER: swifttrack_user
      POSTGRES_PASSWORD: swifttrack_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swifttrack_user -d swifttrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swifttrack-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swifttrack-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swifttrack
      SPRING_DATASOURCE_USERNAME: swifttrack_user
      SPRING_DATASOURCE_PASSWORD: swifttrack_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      PAYMENT_WEBHOOK_SECRET: whsec_test_secret_key_12345
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
